name: Publish Shorts

# Renders the next unpublished MCQ and uploads it to YouTube, three times a
# day: about 12:00, 17:00 and 21:00 Pakistan time (UTC+5). Off-the-hour
# minutes because GitHub delays jobs scheduled exactly on the hour.
on:
  schedule:
    - cron: "17 7 * * *"
    - cron: "17 12 * * *"
    - cron: "17 16 * * *"
  workflow_dispatch:
    inputs:
      count:
        description: "How many Shorts to publish"
        default: "1"
      dry_run:
        description: "Render only, don't upload"
        type: boolean
        default: false

permissions:
  contents: write

# Two overlapping runs could pick the same MCQ, so run one at a time.
concurrency:
  group: publish-shorts
  cancel-in-progress: false

jobs:
  publish:
    # Pinned so ubuntu-latest moving to Ubuntu 26 can't break headless Chrome.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      # After npm ci, which would otherwise wipe it.
      - name: Cache Remotion's headless Chrome
        uses: actions/cache@v5
        with:
          path: node_modules/.remotion
          key: remotion-chrome-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Render and upload
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          COUNT: ${{ inputs.count || '1' }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: node scripts/publish.js

      - name: Keep the rendered videos for a week
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: shorts-${{ github.run_id }}
          path: out/publish/*.mp4
          retention-days: 7
          if-no-files-found: ignore

      # Runs even if an upload failed, so the ones that succeeded are recorded.
      - name: Record what was published
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mcqs_data/published.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish Shorts (run ${{ github.run_number }})"
          git pull --rebase
          git push
